name: Bug Report
description: Report a bug or unexpected behavior in the contracts
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I call `create_split_payment` with...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Call `create_payment` with amount X
        2. Then call `complete` with...
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages or panics.
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which part of the codebase is affected?
      options:
        - Payments
        - Split Payments
        - Bulk Payments
        - Stellar chain wrapper
        - Shared types/errors
        - Build/CI
        - Other / Not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, OS, soroban-sdk version, etc.
      placeholder: |
        - Rust: 1.97.1
        - OS: Ubuntu 22.04
        - soroban-sdk: 26.1.0
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other information, logs, or screenshots.
    validations:
      required: false
