[workspace]
members = [".", "chains/stellar"]

[package]
name = "orionpay-contract"
version = "0.1.0"
edition = "2024"
# MSRV. `edition = "2024"` already requires Rust >= 1.85; 1.93 is the lowest
# version this workspace is known to build with (see rust-toolchain.toml).
rust-version = "1.93"

[dependencies]
soroban-sdk = { version = "26.1.0", features = ["alloc"] }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `testutils` is host-only and must not be enabled for the wasm32 build, so it is
# gated behind this feature instead of being listed in `[dependencies]`.
# Run tests with `cargo test --features testutils`.
testutils = ["soroban-sdk/testutils", "scaffold-contract"]

# Exposes this crate's own `#[contractimpl]` (`version`, `hello`) for local
# testing. Off by default because `orionpay-stellar` is the deployable contract
# and compiling both surfaces into one wasm module yields `duplicate symbol`.
scaffold-contract = []

default = []